<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Football Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; padding: 40px 0; }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        header p { color: #94a3b8; font-size: 1.1rem; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input {
            flex: 1;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: #10b981; }
        button {
            padding: 16px 30px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .teams { font-size: 1.5rem; font-weight: 700; }
        .league { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .date { color: #64748b; font-size: 0.9rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 5px; }
        .verdict {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 15px;
        }
        .verdict.bet { background: #10b981; color: white; }
        .verdict.wait { background: #f59e0b; color: white; }
        .verdict.nobet { background: #ef4444; color: white; }
        .safest-bet {
            background: linear-gradient(90deg, #1e3a8a, #1e40af);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
        .safest-bet .label { color: #93c5fd; font-size: 0.9rem; }
        .safest-bet .value { font-size: 1.8rem; font-weight: 700; margin: 10px 0; }
        .error { background: #7f1d1d; padding: 20px; border-radius: 12px; text-align: center; }
        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Elite Football Predictor</h1>
            <p>Real-time analysis powered by Bzzoiro Sports Data</p>
        </header>

        <div class="search-box">
            <input type="text" id="teamInput" placeholder="Enter a team name (e.g., Arsenal, Real Madrid)">
            <button id="searchBtn" onclick="analyze()">Analyze</button>
        </div>

        <div id="loading" class="loading hidden">Analyzing match data... (this may take 30 seconds on first load)</div>
        <div id="error" class="error hidden"></div>
        <div id="results"></div>
    </div>

    <script>
        async function analyze() {
            const team = document.getElementById('teamInput').value;
            const btn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const results = document.getElementById('results');

            if (!team) return;

            btn.disabled = true;
            loading.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            results.innerHTML = '';

            try {
                const response = await fetch('https://football-engine.onrender.com/api/analyze?teamName=' + encodeURIComponent(team));
                const data = await response.json();

                loading.classList.add('hidden');
                btn.disabled = false;

                if (data.status === 'no_matches') {
                    errorDiv.textContent = data.message;
                    errorDiv.classList.remove('hidden');
                    return;
                }

                if (data.error) {
                    errorDiv.textContent = data.error;
                    errorDiv.classList.remove('hidden');
                    return;
                }

                let verdictClass = 'nobet';
                if (data.analysis.verdict.includes('BET')) verdictClass = 'bet';
                if (data.analysis.verdict.includes('WAIT')) verdictClass = 'wait';

                results.innerHTML = `
                    <div class="card">
                        <div class="match-header">
                            <div>
                                <div class="teams">${data.match.home} vs ${data.match.away}</div>
                                <div class="league">${data.match.league}</div>
                            </div>
                            <div class="date">${new Date(data.match.kickoff).toLocaleString()}</div>
                        </div>
                        <div class="verdict ${verdictClass}">${data.analysis.verdict}</div>
                    </div>

                    <div class="card">
                        <h3>📊 Probabilities</h3>
                        <div class="grid">
                            <div class="stat-box">
                                <div class="stat-label">Home Win</div>
                                <div class="stat-value" style="color:#10b981">${data.probabilities.homeWin}%</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Draw</div>
                                <div class="stat-value" style="color:#f59e0b">${data.probabilities.draw}%</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Away Win</div>
                                <div class="stat-value" style="color:#3b82f6">${data.probabilities.awayWin}%</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>⚽ Expected Goals</h3>
                        <div class="grid">
                            <div class="stat-box">
                                <div class="stat-label">Home xG</div>
                                <div class="stat-value">${data.expectedGoals.home}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Away xG</div>
                                <div class="stat-value">${data.expectedGoals.away}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Total xG</div>
                                <div class="stat-value">${data.expectedGoals.total}</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>📈 Markets</h3>
                        <div class="grid">
                            <div class="stat-box">
                                <div class="stat-label">Over 2.5</div>
                                <div class="stat-value">${data.markets.over25}%</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Under 2.5</div>
                                <div class="stat-value">${data.markets.under25}%</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">BTTS Yes</div>
                                <div class="stat-value">${data.markets.bttsYes}%</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">BTTS No</div>
                                <div class="stat-value">${data.markets.bttsNo}%</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="safest-bet">
                            <div class="label">🎯 SAFEST SELECTION</div>
                            <div class="value">${data.analysis.safestBet}</div>
                            <div class="label">Confidence: ${data.analysis.confidence}% | Probability: ${data.analysis.probability}%</div>
                        </div>
                    </div>
                `;

            } catch (error) {
                loading.classList.add('hidden');
                btn.disabled = false;
                errorDiv.textContent = 'Connection error. Please try again. The server may be waking up from sleep.';
                errorDiv.classList.remove('hidden');
            }
        }

        document.getElementById('teamInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') analyze();
        });
    </script>
</body>
</html>
