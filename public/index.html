<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Football Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; padding: 40px 0; }
        header h1 { font-size: 2.5rem; background: linear-gradient(90deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        header p { color: #94a3b8; font-size: 1.1rem; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input { flex: 1; padding: 16px 20px; border-radius: 12px; border: 2px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 1rem; outline: none; }
        input:focus { border-color: #10b981; }
        button { padding: 16px 30px; border-radius: 12px; border: none; background: linear-gradient(90deg, #10b981, #059669); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .section-title { text-align: center; color: #94a3b8; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid #334155; }
        .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .teams-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .team-logo { width: 48px; height: 48px; object-fit: contain; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 4px; }
        .teams { font-size: 1.5rem; font-weight: 700; }
        .vs { color: #64748b; font-size: 1.2rem; margin: 0 8px; }
        .league { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
        .date { color: #64748b; font-size: 0.9rem; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; margin-top: 5px; }
        .status-live { background: #ef4444; color: white; }
        .status-finished { background: #64748b; color: white; }
        .status-upcoming { background: #3b82f6; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-box { background: #0f172a; border-radius: 12px; padding: 15px; text-align: center; }
        .stat-label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 5px; }
        .verdict { display: inline-block; padding: 10px 20px; border-radius: 100px; font-weight: 700; font-size: 1rem; margin-top: 15px; }
        .verdict.bet { background: #10b981; color: white; }
        .verdict.wait { background: #f59e0b; color: white; }
        .verdict.nobet { background: #ef4444; color: white; }
        .prediction-row { background: #0f172a; border-radius: 10px; padding: 12px 18px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .prediction-label { color: #94a3b8; font-size: 0.85rem; }
        .prediction-value { font-weight: 700; font-size: 1.1rem; color: #10b981; }
        .ai-preview { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); border-radius: 12px; padding: 20px; margin-top: 20px; border: 1px solid #3b82f6; }
        .ai-preview-title { color: #93c5fd; font-size: 0.85rem; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; letter-spacing: 1px; }
        .ai-preview-text { color: #dbeafe; font-size: 0.95rem; line-height: 1.6; }
        .safest-bet { background: linear-gradient(90deg, #059669, #10b981); border-radius: 12px; padding: 20px; text-align: center; margin-top: 20px; }
        .safest-bet .label { color: #d1fae5; font-size: 0.9rem; }
        .safest-bet .value { font-size: 1.8rem; font-weight: 700; margin: 10px 0; color: white; }
        .error { background: #7f1d1d; padding: 20px; border-radius: 12px; text-align: center; }
        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .hidden { display: none; }
        h3 { margin-top: 20px; margin-bottom: 10px; font-size: 1.1rem; color: #cbd5e1; }

        /* WAKING UP MESSAGE */
        .wakeup-box {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-top: 20px;
            border: 1px solid #3b82f6;
        }
        .wakeup-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .wakeup-title { color: #93c5fd; font-size: 1.3rem; font-weight: 700; margin-bottom: 10px; }
        .wakeup-text { color: #dbeafe; font-size: 1rem; line-height: 1.6; }
        .wakeup-countdown { color: #60a5fa; font-size: 0.9rem; margin-top: 15px; font-weight: 600; }

        /* CHART STYLES */
        .chart-bar-container { margin-top: 10px; }
        .chart-row { display: flex; align-items: center; margin-bottom: 8px; }
        .chart-label { width: 100px; color: #94a3b8; font-size: 0.85rem; }
        .chart-bar-bg { flex: 1; background: #0f172a; border-radius: 6px; height: 24px; position: relative; overflow: hidden; }
        .chart-bar { height: 100%; border-radius: 6px; transition: width 0.5s; }
        .chart-bar.home { background: linear-gradient(90deg, #10b981, #059669); }
        .chart-bar.draw { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .chart-bar.away { background: linear-gradient(90deg, #3b82f6, #2563eb); }
        .chart-bar.over { background: linear-gradient(90deg, #8b5cf6, #7c3aed); }
        .chart-bar.btts { background: linear-gradient(90deg, #ec4899, #db2777); }
        .chart-value { margin-left: 10px; color: #f1f5f9; font-weight: 700; font-size: 0.85rem; width: 50px; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Elite Football Predictor</h1>
            <p>Real-time analysis powered by Bzzoiro Sports Data</p>
        </header>

        <div class="search-box">
            <input type="text" id="teamInput" placeholder="Search for anything (e.g., Premier League, Arsenal, Brazil)">
            <button id="searchBtn" onclick="analyze()">Search</button>
        </div>

        <div id="wakeup" class="wakeup-box hidden">
            <div class="wakeup-spinner"></div>
            <div class="wakeup-title">☕ Waking up the server...</div>
            <div class="wakeup-text">Our free server went to sleep to save energy. It will be ready in a few seconds. Please wait.</div>
            <div class="wakeup-countdown" id="countdown">Retrying in 5 seconds...</div>
        </div>

        <div id="loading" class="loading hidden">Loading matches...</div>
        <div id="error" class="error hidden"></div>
        <div id="sectionTitle" class="section-title hidden"></div>
        <div id="results"></div>
    </div>

    <script>
        function teamInitials(name) {
            if (!name) return "?";
            const words = name.replace(/FC|SC|CF|AC|AFC|United|City|Club/g, '').trim().split(/\s+/);
            if (words.length >= 2 && words[0] && words[1]) return (words[0][0] + words[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        function teamColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];
            return colors[Math.abs(hash) % colors.length];
        }

        function makeLogo(name) {
            const initials = teamInitials(name);
            const color = teamColor(name);
            const svg = <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="${color}"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">${initials}</text></svg>;
            return 'data:image/svg+xml;base64,' + btoa(svg);
        }

        function renderChart(label, value, colorClass) {
            return <div class="chart-row"><div class="chart-label">${label}</div><div class="chart-bar-bg"><div class="chart-bar ${colorClass}" style="width: ${value}%"></div></div><div class="chart-value">${value}%</div></div>;
        }

        function renderMatches(matches, title) {
            let html = '';
            const titleEl = document.getElementById('sectionTitle');
            if (title) { titleEl.textContent = title; titleEl.classList.remove('hidden'); }
            else { titleEl.classList.add('hidden'); }

            matches.forEach(function(m) {
                let verdictClass = 'nobet';
                if (m.analysis.verdict.includes('BET')) verdictClass = 'bet';
                if (m.analysis.verdict.includes('WAIT')) verdictClass = 'wait';

                let statusClass = 'status-upcoming';
                let statusText = 'UPCOMING';
                if (m.match.matchStatus === 'live' || m.match.matchStatus === 'inprogress' || m.match.matchStatus === '2nd_half' || m.match.matchStatus === '1st_half' || m.match.matchStatus === 'halftime') { statusClass = 'status-live'; statusText = '🔴 LIVE'; }
                else if (m.match.matchStatus === 'finished') { statusClass = 'status-finished'; statusText = 'FINISHED'; }

                const homeLogo = makeLogo(m.match.home);
                const awayLogo = makeLogo(m.match.away);

                html += '<div class="card">';
                html += '<div class="match-header">';
                html += '<div>';
                html += '<div class="teams-row">';
                html += '<img src="' + homeLogo + '" class="team-logo" alt="' + m.match.home + '">';
                html += '<span class="teams">' + m.match.home + '</span>';
                html += '<span class="vs">vs</span>';
                html += '<span class="teams">' + m.match.away + '</span>';
                html += '<img src="' + awayLogo + '" class="team-logo" alt="' + m.match.away + '">';
                html += '</div>';
                html += '<div class="league">' + m.match.league + '</div>';
                html += '<div class="status-badge ' + statusClass + '">' + statusText + '</div>';
                html += '</div>';
                html += '<div class="date">' + new Date(m.match.kickoff).toLocaleString() + '</div>';
                html += '</div>';
                html += '<div class="verdict ' + verdictClass + '">' + m.analysis.verdict + '</div>';

                if (m.aiPreview && m.aiPreview.length > 10) {
                    html += '<div class="ai-preview">';
                    html += '<div class="ai-preview-title">🤖 Bzzoiro AI Match Analysis</div>';
                    html += '<div class="ai-preview-text">' + m.aiPreview.replace(/\n/g, '<br>') + '</div>';
                    html += '</div>';
                }

                html += '<h3>🎯 Predictions</h3>';
                html += '<div class="prediction-row"><span class="prediction-label">Match Result</span><span class="prediction-value">' + m.predictions.matchResult + '</span></div>';
                html += '<div class="prediction-row"><span class="prediction-label">Double Chance</span><span class="prediction-value">' + m.predictions.doubleChance + '</span></div>';

                html += '<h3>📊 Match Result Chart</h3>';
                html += '<div class="chart-bar-container">';
                html += renderChart('Home Win', m.probabilities.homeWin, 'home');
                html += renderChart('Draw', m.probabilities.draw, 'draw');
                html += renderChart('Away Win', m.probabilities.awayWin, 'away');
                html += '</div>';

                html += '<h3>⚽ Goals Chart</h3>';
                html += '<div class="chart-bar-container">';
                html += renderChart('Over 1.5', m.markets.over15, 'over');
                html += renderChart('Over 2.5', m.markets.over25, 'over');
                html += renderChart('Over 3.5', m.markets.over35, 'over');
                html += renderChart('Over 4.5', m.markets.over45, 'over');
                html += '</div>';

                html += '<h3>🥅 BTTS Chart</h3>';
                html += '<div class="chart-bar-container">';
                html += renderChart('BTTS Yes', m.markets.bttsYes, 'btts');
                html += renderChart('BTTS No', m.markets.bttsNo, 'home');
                html += '</div>';

                html += '<div class="safest-bet">';
                html += '<div class="label">🎯 SAFEST SELECTION</div>';
                html += '<div class="value">' + m.analysis.safestBet + '</div>';
                html += '<div class="label">Confidence: ' + m.analysis.confidence + '% | Probability: ' + m.analysis.probability + '%</div>';
                html += '</div>';

                html += '</div>';
            });

            document.getElementById('results').innerHTML = html;
        }

        async function fetchWithRetry(url, maxRetries) {
            const wakeup = document.getElementById('wakeup');
            const countdown = document.getElementById('countdown');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');

            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 second timeout

                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    const data = await response.json();

                    // Success - hide wakeup, return data
                    wakeup.classList.add('hidden');
                    loading.classList.add('hidden');
                    return data;

                } catch (error) {
                    // Show wakeup message on retries
                    if (attempt < maxRetries) {
                        wakeup.classList.remove('hidden');
                        let secondsLeft = 5;
                        countdown.textContent = 'Retrying in 5 seconds...';
                        for (let s = 5; s > 0; s--) {
                            countdown.textContent = 'Retrying in ' + s + ' seconds... (attempt ' + (attempt + 1) + ' of ' + maxRetries + ')';
                            await new Promise(r => setTimeout(r, 1000));
                        }
                    } else {
                        wakeup.classList.add('hidden');
                        errorDiv.textContent = 'The server is taking too long. Please refresh the page.';
                        errorDiv.classList.remove('hidden');
                        return null;
                    }
                }
            }
            return null;
        }

        async function loadToday() {
            document.getElementById('wakeup').classList.remove('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('results').innerHTML = '';

            const data = await fetchWithRetry('https://football-engine.onrender.com/api/today', 5);

            if (!data) return;
            if (data.error) { document.getElementById('error').textContent = data.error; document.getElementById('error').classList.remove('hidden'); return; }
            if (data.status === 'no_matches') { document.getElementById('error').textContent = data.message; document.getElementById('error').classList.remove('hidden'); return; }
            renderMatches(data.matches, '📅 Latest Matches with Bzzoiro AI Analysis');
        }

        async function analyze() {
            const team = document.getElementById('teamInput').value;
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            document.getElementById('error').classList.add('hidden');
            document.getElementById('results').innerHTML = '';
            document.getElementById('wakeup').classList.remove('hidden');

            const data = await fetchWithRetry('https://football-engine.onrender.com/api/analyze?teamName=' + encodeURIComponent(team), 5);

            btn.disabled = false;
            if (!data) return;
            if (data.status === 'no_matches') { document.getElementById('error').textContent = data.message; document.getElementById('error').classList.remove('hidden'); return; }
            if (data.error) { document.getElementById('error').textContent = data.error; document.getElementById('error').classList.remove('hidden'); return; }
            const title = team ? '🔍 Results for "' + team + '"' : '📅 Latest Matches';
            renderMatches(data.matches, title);
        }

        document.getElementById('teamInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') analyze();
        });

        window.addEventListener('load', loadToday);
    </script>
</body>
</html>
