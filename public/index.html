<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Football Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0 20px 0; }
        header h1 { font-size: 2.2rem; background: linear-gradient(90deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        header p { color: #94a3b8; font-size: 1rem; }
        
        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .tab { padding: 12px 24px; border-radius: 100px; border: 2px solid #334155; background: #1e293b; color: #94a3b8; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .tab.active { background: linear-gradient(90deg, #10b981, #059669); color: white; border-color: transparent; }
        .tab:hover { transform: scale(1.05); }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 14px 18px; border-radius: 12px; border: 2px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 1rem; outline: none; }
        input:focus { border-color: #10b981; }
        button.search-btn { padding: 14px 26px; border-radius: 12px; border: none; background: linear-gradient(90deg, #10b981, #059669); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button.search-btn:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* MATCH LIST */
        .match-list-item { background: #1e293b; border-radius: 14px; padding: 18px; margin-bottom: 12px; border: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; transition: border-color 0.2s; }
        .match-list-item:hover { border-color: #10b981; }
        .match-info { flex: 1; min-width: 200px; }
        .match-teams { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
        .match-meta { color: #94a3b8; font-size: 0.85rem; }
        .match-status-mini { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 0.7rem; font-weight: 600; margin-left: 8px; }
        .status-live { background: #ef4444; color: white; }
        .status-finished { background: #64748b; color: white; }
        .status-upcoming { background: #3b82f6; color: white; }
        .analyze-btn { padding: 10px 20px; border-radius: 10px; border: none; background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .analyze-btn:hover { transform: scale(1.05); }
        
        /* SINGLE MATCH VIEW */
        .back-btn { padding: 12px 24px; border-radius: 12px; border: 2px solid #334155; background: #1e293b; color: #94a3b8; font-weight: 600; cursor: pointer; margin-bottom: 20px; font-size: 1rem; }
        .back-btn:hover { color: white; border-color: #10b981; }
        .card { background: #1e293b; border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid #334155; }
        .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .teams-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .team-logo { width: 48px; height: 48px; object-fit: contain; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 4px; }
        .teams { font-size: 1.5rem; font-weight: 700; }
        .vs { color: #64748b; font-size: 1.2rem; margin: 0 8px; }
        .league { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
        .date { color: #64748b; font-size: 0.9rem; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; margin-top: 5px; }
        .verdict { display: inline-block; padding: 10px 20px; border-radius: 100px; font-weight: 700; font-size: 1rem; margin-top: 15px; }
        .verdict.bet { background: #10b981; color: white; }
        .verdict.wait { background: #f59e0b; color: white; }
        .verdict.nobet { background: #ef4444; color: white; }
        .prediction-row { background: #0f172a; border-radius: 10px; padding: 12px 18px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .prediction-label { color: #94a3b8; font-size: 0.85rem; }
        .prediction-value { font-weight: 700; font-size: 1.1rem; color: #10b981; }
        .ai-preview { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); border-radius: 12px; padding: 20px; margin-top: 20px; border: 1px solid #3b82f6; }
        .ai-preview-title { color: #93c5fd; font-size: 0.85rem; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; letter-spacing: 1px; }
        .ai-preview-text { color: #dbeafe; font-size: 0.95rem; line-height: 1.6; }
        .safest-bet { background: linear-gradient(90deg, #059669, #10b981); border-radius: 12px; padding: 20px; text-align: center; margin-top: 20px; }
        .safest-bet .label { color: #d1fae5; font-size: 0.9rem; }
        .safest-bet .value { font-size: 1.8rem; font-weight: 700; margin: 10px 0; color: white; }
        .error { background: #7f1d1d; padding: 20px; border-radius: 12px; text-align: center; }
        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .hidden { display: none; }
        h3 { margin-top: 20px; margin-bottom: 10px; font-size: 1.1rem; color: #cbd5e1; }
        .chart-bar-container { margin-top: 10px; }
        .chart-row { display: flex; align-items: center; margin-bottom: 8px; }
        .chart-label { width: 100px; color: #94a3b8; font-size: 0.85rem; }
        .chart-bar-bg { flex: 1; background: #0f172a; border-radius: 6px; height: 24px; position: relative; overflow: hidden; }
        .chart-bar { height: 100%; border-radius: 6px; transition: width 0.5s; }
        .chart-bar.home { background: linear-gradient(90deg, #10b981, #059669); }
        .chart-bar.draw { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .chart-bar.away { background: linear-gradient(90deg, #3b82f6, #2563eb); }
        .chart-bar.over { background: linear-gradient(90deg, #8b5cf6, #7c3aed); }
        .chart-bar.btts { background: linear-gradient(90deg, #ec4899, #db2777); }
        .chart-value { margin-left: 10px; color: #f1f5f9; font-weight: 700; font-size: 0.85rem; width: 50px; text-align: right; }
        .empty-msg { text-align: center; padding: 40px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Elite Football Predictor</h1>
            <p>Real-time analysis powered by Bzzoiro Sports Data</p>
        </header>

        <!-- MAIN SCREEN -->
        <div id="mainScreen">
            <div class="search-box">
                <input type="text" id="teamInput" placeholder="Search team or league (e.g., Arsenal, Nigeria, La Liga)">
                <button class="search-btn" id="searchBtn" onclick="searchTeam()">Search</button>
            </div>
            <div class="tabs">
                <div class="tab active" id="tabAll" onclick="switchTab('all')">📅 All Matches</div>
                <div class="tab" id="tabLive" onclick="switchTab('live')">🔴 Live Now</div>
            </div>
            <div id="mainLoading" class="loading">☕ Loading matches... Please wait 30-60 seconds (server may be waking up)</div>
            <div id="mainError" class="error hidden"></div>
            <div id="matchList"></div>
        </div>

        <!-- SINGLE MATCH SCREEN -->
        <div id="singleScreen" class="hidden">
            <button class="back-btn" onclick="goBack()">← Back to Matches</button>
            <div id="singleContent"></div>
        </div>
    </div>

    <script>
        let currentTab = 'all';
        let cachedMatches = [];

        // Generate team logo
        function teamInitials(name) {
            if (!name) return "?";
            const words = name.replace(/FC|SC|CF|AC|AFC|United|City|Club/g, '').trim().split(/\s+/);
            if (words.length >= 2 && words[0] && words[1]) return (words[0][0] + words[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }
        function teamColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];
            return colors[Math.abs(hash) % colors.length];
        }
        function makeLogo(name) {
            try {
                const initials = teamInitials(name);
                const color = teamColor(name);
                const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="' + color + '"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">' + initials + '</text></svg>';
                return 'data:image/svg+xml;base64,' + btoa(svg);
            } catch (e) { return ''; }
        }
        function statusBadge(status) {
            const s = (status || '').toLowerCase();
            if (s === 'live' || s === 'inprogress' || s === '2nd_half' || s === '1st_half' || s === 'halftime') return { class: 'status-live', text: '🔴 LIVE' };
            if (s === 'finished') return { class: 'status-finished', text: 'FINISHED' };
            return { class: 'status-upcoming', text: 'UPCOMING' };
        }

        // RENDER MATCH LIST (Screen 1)
        function renderMatchList(matches, title) {
            if (!matches || matches.length === 0) {
                document.getElementById('matchList').innerHTML = '<div class="empty-msg">No matches to show.</div>';
                return;
            }
            let html = '';
            if (title) {
                html += '<h3 style="text-align:center; margin-bottom:15px;">' + title + ' (' + matches.length + ')</h3>';
            }
            matches.forEach(function(m, index) {
                const sb = statusBadge(m.match.matchStatus);
                const homeLogo = makeLogo(m.match.home);
                const awayLogo = makeLogo(m.match.away);
                html += '<div class="match-list-item">';
                html += '<div class="match-info">';
                html += '<div class="match-teams">';
                html += '<img src="' + homeLogo + '" style="width:24px;height:24px;vertical-align:middle;margin-right:6px;border-radius:4px;">';
                html += m.match.home + ' <span style="color:#64748b;">vs</span> ' + m.match.away;
                html += ' <img src="' + awayLogo + '" style="width:24px;height:24px;vertical-align:middle;margin-left:6px;border-radius:4px;">';
                html += '</div>';
                html += '<div class="match-meta">' + m.match.league + ' • ' + new Date(m.match.kickoff).toLocaleString();
                html += '<span class="match-status-mini ' + sb.class + '">' + sb.text + '</span>';
                html += '</div>';
                html += '</div>';
                html += '<button class="analyze-btn" onclick="showSingleMatch(' + index + ')">Analyze →</button>';
                html += '</div>';
            });
            document.getElementById('matchList').innerHTML = html;
            cachedMatches = matches;
        }

        // SHOW SINGLE MATCH (Screen 2)
        function showSingleMatch(index) {
            const m = cachedMatches[index];
            if (!m) return;
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('singleScreen').classList.remove('hidden');
            document.getElementById('singleContent').innerHTML = renderFullMatch(m);
            window.scrollTo(0, 0);
        }

        function goBack() {
            document.getElementById('singleScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // RENDER FULL MATCH (charts, AI, everything)
        function renderFullMatch(m) {
            let verdictClass = 'nobet';
            if (m.analysis.verdict.indexOf('BET') !== -1) verdictClass = 'bet';
            if (m.analysis.verdict.indexOf('WAIT') !== -1) verdictClass = 'wait';
            const sb = statusBadge(m.match.matchStatus);
            const homeLogo = makeLogo(m.match.home);
            const awayLogo = makeLogo(m.match.away);

            let html = '<div class="card">';
            html += '<div class="match-header">';
            html += '<div>';
            html += '<div class="teams-row">';
            html += '<img src="' + homeLogo + '" class="team-logo">';
            html += '<span class="teams">' + m.match.home + '</span>';
            html += '<span class="vs">vs</span>';
            html += '<span class="teams">' + m.match.away + '</span>';
            html += '<img src="' + awayLogo + '" class="team-logo">';
            html += '</div>';
            html += '<div class="league">' + m.match.league + '</div>';
            html += '<div class="status-badge ' + sb.class + '">' + sb.text + '</div>';
            html += '</div>';
            html += '<div class="date">' + new Date(m.match.kickoff).toLocaleString() + '</div>';
            html += '</div>';
            html += '<div class="verdict ' + verdictClass + '">' + m.analysis.verdict + '</div>';

            if (m.aiPreview && m.aiPreview.length > 10) {
                html += '<div class="ai-preview">';
                html += '<div class="ai-preview-title">🤖 Bzzoiro AI Match Analysis</div>';
                html += '<div class="ai-preview-text">' + m.aiPreview.replace(/\n/g, '<br>') + '</div>';
                html += '</div>';
            }

            html += '<h3>🎯 Predictions</h3>';
            html += '<div class="prediction-row"><span class="prediction-label">Match Result</span><span class="prediction-value">' + m.predictions.matchResult + '</span></div>';
            html += '<div class="prediction-row"><span class="prediction-label">Double Chance</span><span class="prediction-value">' + m.predictions.doubleChance + '</span></div>';

            html += '<h3>📊 Match Result Chart</h3>';
            html += '<div class="chart-bar-container">';
            html += chartRow('Home Win', m.probabilities.homeWin, 'home');
            html += chartRow('Draw', m.probabilities.draw, 'draw');
            html += chartRow('Away Win', m.probabilities.awayWin, 'away');
            html += '</div>';

            html += '<h3>⚽ Goals Chart</h3>';
            html += '<div class="chart-bar-container">';
            html += chartRow('Over 1.5', m.markets.over15, 'over');
            html += chartRow('Over 2.5', m.markets.over25, 'over');
            html += chartRow('Over 3.5', m.markets.over35, 'over');
            html += chartRow('Over 4.5', m.markets.over45, 'over');
            html += '</div>';

            html += '<h3>🥅 BTTS Chart</h3>';
            html += '<div class="chart-bar-container">';
            html += chartRow('BTTS Yes', m.markets.bttsYes, 'btts');
            html += chartRow('BTTS No', m.markets.bttsNo, 'home');
            html += '</div>';

            html += '<div class="safest-bet">';
            html += '<div class="label">🎯 SAFEST SELECTION</div>';
            html += '<div class="value">' + m.analysis.safestBet + '</div>';
            html += '<div class="label">Confidence: ' + m.analysis.confidence + '% | Probability: ' + m.analysis.probability + '%</div>';
            html += '</div>';
            html += '</div>';
            return html;
        }

        function chartRow(label, value, colorClass) {
            return '<div class="chart-row"><div class="chart-label">' + label + '</div><div class="chart-bar-bg"><div class="chart-bar ' + colorClass + '" style="width: ' + value + '%"></div></div><div class="chart-value">' + value + '%</div></div>';
        }

        // LOAD DATA
        async function loadMatches(url, title) {
            document.getElementById('mainLoading').classList.remove('hidden');
            document.getElementById('mainError').classList.add('hidden');
            document.getElementById('matchList').innerHTML = '';
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(function() { controller.abort(); }, 90000);
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await response.json();
                document.getElementById('mainLoading').classList.add('hidden');
                if (data.error) { document.getElementById('mainError').textContent = data.error; document.getElementById('mainError').classList.remove('hidden'); return; }
                if (data.status === 'no_matches') { document.getElementById('mainError').textContent = data.message; document.getElementById('mainError').classList.remove('hidden'); return; }
                renderMatchList(data.matches, title);
            } catch (error) {
                document.getElementById('mainLoading').classList.add('hidden');
                document.getElementById('mainError').textContent = 'Server is taking too long to wake up. Please refresh in 30 seconds.';
                document.getElementById('mainError').classList.remove('hidden');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabAll').classList.toggle('active', tab === 'all');
            document.getElementById('tabLive').classList.toggle('active', tab === 'live');
            if (tab === 'live') {
                loadMatches('https://football-engine.onrender.com/api/live', '🔴 Live Matches');
            } else {
                loadMatches('https://football-engine.onrender.com/api/today', '📅 Today & Upcoming');
            }
        }

        function searchTeam() {
            const team = document.getElementById('teamInput').value.trim();
            if (!team) { switchTab('all'); return; }
            const url = 'https://football-engine.onrender.com/api/analyze?teamName=' + encodeURIComponent(team);
            loadMatches(url, '🔍 Results for "' + team + '"');
        }

        document.getElementById('teamInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchTeam();
        });

        window.addEventListener('load', function() { switchTab('all'); });
    </script>
</body>
</html>
